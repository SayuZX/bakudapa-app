name: bakudapa_mobile
description: "Aplikasi layanan administrasi kependudukan Disdukcapil Provinsi Maluku Utara."
publish_to: none
version: 7.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  app_links: ^6.3.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hugeicons: ^0.0.11
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.3
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^1.0.6
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.1
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0
  safe_device: ^1.1.10
  camera: ^0.11.0+2
  local_auth: ^2.3.0
  google_mlkit_face_detection: ^0.13.0
  sensors_plus: ^6.1.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  flutter_markdown: ^0.7.4
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
